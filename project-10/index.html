<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
       <div class="Audio-Container">
            <img src="88bff30c49521bad727c8983aae42689005b18dd3905e54eaef6054176b8b05e.jpg">
            <div class="audio-section">
                <audio controls>
                    <source src="Maine Pyar kiya Lyrical _ Maine Pyar Kiya _ Lata Mangeshkar _ S.P. B _ Salman _ Bhagyashree _90s Hit [8sZesHXgizU].mp3">
                </audio>
                <input type="range" value="0" class="song-time">
                <div class="buttons">
                    <button><i class="fa-solid fa-backward-step"></i></button>
                    <button><i class="fa-solid fa-play"></i></button>
                    <button><i class="fa-solid fa-forward-step"></i></button>
                </div>
            </div>
       </div> 

    <script src="script.js"></script>
</body>
</html>
