<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Player</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/toggle.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/player.css">
    <link rel="stylesheet" href="css/media.css">



    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="logo">
            <i class="fa-solid fa-music"></i>
            <h2>Music Player</h2>
        </div>

        <div class="search-box">
            <input type="text" placeholder="Search Songs...">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>

        <div class="theme-toggle">
            <i class="fa-solid fa-moon"></i>
        </div>

    </header>

    <!-- ================= MAIN LAYOUT ================= -->

    <div class="layout">

        <!-- ================= SIDEBAR ================= -->

        <aside class="sidebar">

            <h2>Playlist</h2>

            <div class="song-list">

                <div class="song-item">
                    <img src="images/i'amDone.jfif" alt="">
                    <div>
                        <h4>I'm Done</h4>
                        <p>Maan Panu</p>
                    </div>
                </div>

                <div class="song-item">
                    <img src="images/maien-pyar-kiya.jpg" alt="">
                    <div>
                        <h4>Maine Pyar Kiya</h4>
                        <p>Lata Mangeshkar</p>
                    </div>
                </div>

                <div class="song-item">
                    <img src="images/tumhi ho.jfif" alt="">
                    <div>
                        <h4>Tum Hi Ho</h4>
                        <p>Arijit Singh</p>
                    </div>
                </div>

                <div class="song-item">
                    <img src="images/song4.jpg" alt="">
                    <div>
                        <h4>Kesariya</h4>
                        <p>Arijit Singh</p>
                    </div>
                </div>

                <div class="song-item">
                    <img src="images/song5.jpg" alt="">
                    <div>
                        <h4>O Maahi</h4>
                        <p>Arijit Singh</p>
                    </div>
                </div>

                <div class="song-item">
                    <img src="images/song6.jpg" alt="">
                    <div>
                        <h4>Apna Bana Le</h4>
                        <p>Arijit Singh</p>
                    </div>
                </div>

            </div>

        </aside>

        <!-- ================= PLAYER ================= -->

        <div class="Audio-Container">

            <img class="album-cover" src="images/maien-pyar-kiya.jpg">

            <div class="audio-section">

                <div class="song-details">
                    <h2 class="song-name">Maine Pyar Kiya</h2>
                    <p class="artist-name">Lata Mangeshkar</p>
                </div>

                <audio class="audio">
                    <source src="song/maien pyar kiya.mp3">
                </audio>

                <input type="range" class="song-time" min="0" max="100" value="0">

                <div class="time-info">
                    <span class="current-time">0:00</span>
                    <span class="duration">0:00</span>
                </div>

                <div class="buttons">

                    <button class="previousBtn">
                        <i class="fa-solid fa-backward-step"></i>
                    </button>

                    <button class="playBtn">
                        <i class="fa-solid fa-play"></i>
                    </button>

                    <button class="nextBtn">
                        <i class="fa-solid fa-forward-step"></i>
                    </button>

                </div>

            </div>

        </div>

    </div>

    <script type="module" src="script.js"></script>

</body>

</html>
